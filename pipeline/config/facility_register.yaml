# Curated facility register (human-in-the-loop), EPSG:32735 metres.
#
# Mining agencies monitor *named* facilities, not loose pixels. Each outline is an analyst-drawn polygon traced on
# very-high-resolution imagery (Esri World Imagery, about 1 m, reprojected to this grid) and checked against the
# 2023-08-12 Sentinel-2 image: perimeter haul roads, dam walls and the edge of disturbed ground or water. See
# figures/09_facility_register.png. Vertices are accurate to roughly 50 m, i.e. 5 Sentinel-2 pixels.
#
# Facilities never overlap: the list is in priority order and s2cd.register removes from each polygon the area already
# claimed by the facilities above it, so neighbours share one edge (the waste dumps are cut out of the south pit
# complex, the plant out of the tailings facility, and so on). Each facility is one polygon, without loose fragments.
# Names are descriptive; the site identity (likely Lumwana) is an inference.
#
# Class -> what a change inside it most likely means (s2cd.interpret):
#   pit_dump_complex  -> excavation or dumping (pits and their waste dumps; not separable without elevation)
#   waste_dump        -> waste dumping
#   tailings          -> tailings deposition (beach + pond)
#   water_reservoir   -> water level / water surface change
#   plant             -> infrastructure change
#   camp, settlement  -> infrastructure / settlement growth (the brief's "urban expansion")

