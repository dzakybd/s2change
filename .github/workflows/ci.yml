name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q -m "not slow"

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hashFiles() is not available in job-level `if`, so the lockfile guard sits on each step.
      - id: lock
        run: echo "present=${{ hashFiles('webapp/viewer/package-lock.json') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.lock.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/viewer/package-lock.json
      - if: steps.lock.outputs.present == 'true'
        working-directory: webapp/viewer
        run: npm ci
      - if: steps.lock.outputs.present == 'true'
        working-directory: webapp/viewer
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: s2cd:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm s2cd:ci run --help
