services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64  # no arm64 build of this tag; runs under emulation on Apple Silicon
    environment:
      POSTGRES_USER: s2cd
      POSTGRES_PASSWORD: s2cd
      POSTGRES_DB: s2cd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s2cd -d s2cd"]
      interval: 3s
      timeout: 3s
      retries: 20

  pipeline:
    build: .
    image: s2cd:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://s2cd:s2cd@db:5432/s2cd
    volumes:
      - ./inputs:/app/inputs
      - ./outputs:/app/outputs
      - ./figures:/app/figures
      - ./webapp/data:/app/webapp/data
      - ./pipeline/config:/app/pipeline/config
    command: ["run"]

volumes:
  pgdata:
