<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumwana change detection viewer</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app">
      <nav id="topbar" aria-label="Views">
        <div class="brand"><span class="brand-mark"></span><span>Lumwana change detection</span></div>
        <div class="tabs" role="tablist">
          <button type="button" class="tab" role="tab" id="tab-assignment" aria-selected="true">Assignment</button>
          <button type="button" class="tab" role="tab" id="tab-timeline" aria-selected="false" tabindex="-1">Timeline 2023&ndash;2026</button>
          <button type="button" class="tab" role="tab" id="tab-agent" aria-selected="false" tabindex="-1">Analyst agent</button>
        </div>
      </nav>
      <div id="body">
      <div id="main-col">
      <main id="stage">
        <div id="map"></div>
        <div id="map-compare"></div>
        <div id="swipe" hidden>
          <div id="swipe-handle" role="slider" tabindex="0" aria-label="Before/after swipe" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
            <span class="knob"></span>
            <span class="swipe-label swipe-label-left" id="swipe-label-left"></span>
            <span class="swipe-label swipe-label-right" id="swipe-label-right"></span>
          </div>
        </div>
        <div id="status" role="status"></div>
      </main>
      <div id="dock" hidden></div>
      </div>
      <aside id="panel" role="tabpanel" aria-labelledby="tab-assignment"></aside>
      <aside id="timeline-panel" class="side" role="tabpanel" aria-labelledby="tab-timeline" hidden></aside>
      <aside id="chat-panel" class="side" role="tabpanel" aria-labelledby="tab-agent" hidden></aside>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
